name: Run GSE220100 NanoString audit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  nanostring:
    if: startsWith(github.event.issue.title, '[RUN-GSE220100]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iga-rips-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: data/external
          key: iga-rips-geo-inputs-v1
      - name: Prepare RCC files
        shell: bash
        run: |
          mkdir -p data/external/GSE220100/rcc
          [ -s data/external/GSE220100/GSE220100_RAW.tar ] || curl -L --fail --retry 8 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE220nnn/GSE220100/suppl/GSE220100_RAW.tar' -o data/external/GSE220100/GSE220100_RAW.tar
          tar -xf data/external/GSE220100/GSE220100_RAW.tar -C data/external/GSE220100/rcc
      - name: Install and run
        id: run
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 scikit-learn==1.5.2 statsmodels==0.14.4 PyYAML==6.0.2
          cd analysis_pipeline
          python scripts/04_gse220100_nanostring.py --rcc-dir ../data/external/GSE220100/rcc --metadata metadata/GSE220100_samples.csv --signatures config/rips_signatures.yml --outdir results/gse220100 2>&1 | tee logs_gse220100.txt
      - name: Commit outputs
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_pipeline/results/gse220100 analysis_pipeline/logs_gse220100.txt || true
          if ! git diff --cached --quiet; then git commit -m 'Complete GSE220100 NanoString normalization audit'; git push origin HEAD:iga-rips-release; fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          {
            echo '### GSE220100 NanoString audit'
            echo
            echo "Run outcome: ${{ steps.run.outcome }}"
            echo "Workflow run ID: $GITHUB_RUN_ID"
            if [ -f analysis_pipeline/results/gse220100/GSE220100_run_summary.json ]; then echo; echo '```json'; cat analysis_pipeline/results/gse220100/GSE220100_run_summary.json; echo '```'; fi
            if [ -f analysis_pipeline/logs_gse220100.txt ]; then echo; echo '<details><summary>Log tail</summary>'; echo; echo '```text'; tail -n 40 analysis_pipeline/logs_gse220100.txt; echo '```'; echo '</details>'; fi
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
