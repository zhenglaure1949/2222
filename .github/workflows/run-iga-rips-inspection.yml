name: Run IgA RIPS input inspection

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[RUN-IGA-RIPS-INSPECTION]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: iga-rips-release
          fetch-depth: 0
      - name: Restore GEO cache
        uses: actions/cache@v4
        with:
          path: data/external
          key: iga-rips-geo-inputs-v1
      - name: Download and inspect public GEO inputs
        shell: bash
        run: |
          mkdir -p inspection data/external/GSE127136 data/external/GSE220100 data/external/GSE286911
          exec > >(tee inspection/workflow.log) 2>&1
          set +e
          download() {
            local url="$1" out="$2"
            if [ -s "$out" ]; then echo "Cached: $out"; return 0; fi
            curl -L --fail --retry 8 --retry-delay 10 --connect-timeout 30 --continue-at - "$url" -o "$out"
          }
          download 'https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSE127136&file=GSE127136_project_IgA_nephropathy_counts.csv.gz&format=file' 'data/external/GSE127136/GSE127136_project_IgA_nephropathy_counts.csv.gz'
          rc1=$?
          download 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE220nnn/GSE220100/suppl/GSE220100_RAW.tar' 'data/external/GSE220100/GSE220100_RAW.tar'
          rc2=$?
          download 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE286nnn/GSE286911/suppl/GSE286911_RAW.tar' 'data/external/GSE286911/GSE286911_RAW.tar'
          rc3=$?
          rc4=0
          if [ $rc1 -eq 0 ] && [ $rc2 -eq 0 ] && [ $rc3 -eq 0 ]; then
            python scripts/inspect_geo_inputs.py || rc4=$?
          else
            rc4=99
          fi
          printf 'GSE127136_download=%s\nGSE220100_download=%s\nGSE286911_download=%s\ninspection=%s\nrun_id=%s\n' "$rc1" "$rc2" "$rc3" "$rc4" "$GITHUB_RUN_ID" > inspection/workflow_status.txt
          ls -lh data/external/*/* || true
          exit 0
      - name: Commit inspection result to analysis branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection
          if git diff --cached --quiet; then
            echo 'No inspection changes to commit.'
          else
            git commit -m 'Record GEO input inspection results'
            git push origin HEAD:iga-rips-release
          fi
      - name: Report status to trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          {
            echo '### GEO input inspection completed'
            echo
            echo '```text'
            cat inspection/workflow_status.txt
            echo '```'
            echo
            echo "Workflow run ID: $GITHUB_RUN_ID"
            echo 'Detailed logs and input manifests were committed to the `iga-rips-release` branch under `inspection/`.'
          } > inspection/issue_comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file inspection/issue_comment.md
