name: Check IgA RIPS workflow status

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to receive the status comment
        required: true
        type: string

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch input
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: '[[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue number" >&2; exit 1; }'
      - name: Query recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue number" >&2; exit 1; }
          gh run list --repo "$GITHUB_REPOSITORY" --workflow run-iga-rips-full-analysis.yml --limit 10 --json databaseId,status,conclusion,createdAt,updatedAt,event,displayTitle,headSha,url > /tmp/runs.json
          {
            echo '### IgA RIPS workflow heartbeat'
            echo
            echo '```json'
            cat /tmp/runs.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
